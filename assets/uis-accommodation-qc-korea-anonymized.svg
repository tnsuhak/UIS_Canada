<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1120" role="img" aria-labelledby="t d">
<title id="t">UIS 한국 학생 숙소 퀄리티 컨트롤 리포트 익명화 샘플</title><desc id="d">UIS 한국센터가 제공한 2026년 Student Welfare QC Report 샘플을 학생 개인정보가 드러나지 않도록 재구성한 이미지</desc>
<rect width="900" height="1120" fill="#f7f6f2"/><rect x="28" y="24" width="844" height="1070" rx="8" fill="#fff" stroke="#d8d3c7"/>
<text x="58" y="70" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#131c36">PRE-INSPECTION REPORT</text><text x="58" y="103" font-family="Arial,sans-serif" font-size="14" fill="#5f6980">UIS Student Welfare · Accommodation Quality Control</text>
<rect x="58" y="128" width="784" height="93" rx="5" fill="#f1ede3"/><g font-family="Arial,sans-serif" font-size="14" fill="#39445c"><text x="78" y="158">Date: March 2026</text><text x="330" y="158">Nationality: Korea</text><text x="585" y="158">Housing: Premium Homestay</text><text x="78" y="190">Student Name:</text><rect x="178" y="173" width="140" height="25" fill="#b9b9b9"/><text x="350" y="190">Grade: 12</text><text x="585" y="190">Status: New Student</text></g>
<text x="58" y="265" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#2d7180">GENERAL OBSERVATION</text><text x="58" y="296" font-family="Arial,sans-serif" font-size="14" fill="#485269">숙소 적응, 호스트 가족과의 관계, 학업 계획, 생활 습관을 담당자가 직접 확인해 기록합니다.</text><text x="58" y="322" font-family="Arial,sans-serif" font-size="14" fill="#485269">학생의 강점뿐 아니라 개선이 필요한 생활 패턴도 함께 전달해 학부모가 실제 생활을 파악할 수 있습니다.</text>
<line x1="58" y1="352" x2="842" y2="352" stroke="#ded9cf"/>
<text x="58" y="390" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#2d7180">DAILY SCHEDULE</text><g font-family="Arial,sans-serif" font-size="14" fill="#485269"><text x="78" y="424">07:30</text><text x="180" y="424">기상 · 아침 준비</text><text x="78" y="452">08:00</text><text x="180" y="452">등교</text><text x="78" y="480">16:00–18:00</text><text x="180" y="480">도서관 학습 또는 귀가</text><text x="78" y="508">18:30–19:00</text><text x="180" y="508">호스트 가족과 저녁 식사</text><text x="78" y="536">Evening</text><text x="180" y="536">학습 · 휴식 · 친구/가족과 연락</text></g>
<text x="492" y="390" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#2d7180">BEHAVIOUR &amp; ADJUSTMENT</text><g font-family="Arial,sans-serif" font-size="14" fill="#485269"><text x="510" y="424">• 세탁·정리 등 생활 습관</text><text x="510" y="452">• 식사 중 휴대전화 사용 여부</text><text x="510" y="480">• 호스트 가족과의 관계</text><text x="510" y="508">• 귀가 시간 및 주말 생활</text></g>
<line x1="58" y1="570" x2="842" y2="570" stroke="#ded9cf"/>
<text x="58" y="608" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#2d7180">STUDENT ENGAGEMENT</text><rect x="58" y="630" width="354" height="190" rx="5" fill="#e5e1d8"/><rect x="82" y="655" width="92" height="92" fill="#c1bdb4"/><rect x="191" y="655" width="92" height="92" fill="#b8b4aa"/><rect x="300" y="655" width="88" height="92" fill="#c8c4ba"/><text x="82" y="780" font-family="Arial,sans-serif" font-size="12" fill="#686868">호스트 가정 생활 사진 · 인물 비식별화</text><text x="450" y="650" font-family="Arial,sans-serif" font-size="14" fill="#485269">학생과 호스트 가족의 상호작용,</text><text x="450" y="678" font-family="Arial,sans-serif" font-size="14" fill="#485269">학교 밖 생활과 정서적 적응 상황을</text><text x="450" y="706" font-family="Arial,sans-serif" font-size="14" fill="#485269">구체적인 관찰 내용으로 기록합니다.</text><text x="450" y="754" font-family="Arial,sans-serif" font-size="14" fill="#485269">필요한 개선점이 있으면 호스트와</text><text x="450" y="782" font-family="Arial,sans-serif" font-size="14" fill="#485269">학교가 바로 협의해 조정합니다.</text>
<line x1="58" y1="850" x2="842" y2="850" stroke="#ded9cf"/>
<text x="58" y="890" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#2d7180">MEAL INSPECTION</text><g><rect x="58" y="912" width="116" height="82" rx="4" fill="#d6b67a"/><rect x="184" y="912" width="116" height="82" rx="4" fill="#b8c68a"/><rect x="310" y="912" width="116" height="82" rx="4" fill="#d89364"/><rect x="436" y="912" width="116" height="82" rx="4" fill="#8fb17a"/><rect x="562" y="912" width="116" height="82" rx="4" fill="#d2a26e"/><rect x="688" y="912" width="154" height="82" rx="4" fill="#c78c61"/></g><text x="58" y="1022" font-family="Arial,sans-serif" font-size="14" fill="#485269">식사 제공 상태도 사진과 함께 확인합니다.</text>
<rect x="58" y="1050" width="784" height="28" rx="4" fill="#f1ede3"/><text x="72" y="1069" font-family="Arial,sans-serif" font-size="11.5" fill="#5f6980">※ UIS Korea 제공 2026년 한국 학생 QC 샘플을 바탕으로 학생 이름·인물 사진 등 개인정보를 가린 재구성 예시입니다.</text>
</svg>