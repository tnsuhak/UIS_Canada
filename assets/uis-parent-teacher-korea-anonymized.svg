<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" role="img" aria-labelledby="t d">
<title id="t">UIS 한국 학생 학부모-교사 상담 리포트 익명화 샘플</title><desc id="d">UIS 한국센터가 제공한 2026년 Parent-Teacher Conference Report 샘플을 개인정보가 드러나지 않도록 재구성한 이미지</desc>
<rect width="900" height="590" fill="#f7f6f2"/><rect x="28" y="26" width="844" height="538" rx="8" fill="#fff" stroke="#d8d3c7"/>
<rect x="28" y="26" width="844" height="82" rx="8" fill="#131c36"/><text x="62" y="63" font-family="Arial,sans-serif" font-size="13" fill="#e4d3a8" letter-spacing="2">URBAN INTERNATIONAL SCHOOL</text><text x="62" y="91" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#fff">UIS Parent–Teacher Conference Report</text>
<rect x="650" y="46" width="168" height="41" rx="4" fill="#d9d9d9"/><text x="674" y="73" font-family="Arial,sans-serif" font-size="13" fill="#666">STUDENT INFO •••••</text>
<text x="62" y="143" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#8e1b22">KOREA · Grade 7–10 · Twice a year</text>
<text x="62" y="178" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#131c36">학부모와 과목교사가 학생의 현재 상태를 직접 확인합니다.</text>
<text x="62" y="210" font-family="Arial,sans-serif" font-size="14" fill="#485269">3월·11월 상담을 통해 성적, 수업 참여, 교우 관계, 정서 적응, 향후 학업 계획을 점검합니다.</text>
<text x="62" y="235" font-family="Arial,sans-serif" font-size="14" fill="#485269">한국인 카운슬러가 학부모와 학교 사이의 소통을 돕고, 상담 내용을 정리해 안내합니다.</text>
<line x1="62" y1="267" x2="838" y2="267" stroke="#e2ded5"/>
<g font-family="Arial,sans-serif"><text x="62" y="302" font-size="14" font-weight="700" fill="#131c36">1. Academic Progress</text><text x="62" y="327" font-size="13" fill="#5f6980">과목별 성취도 · 과제 · 수업 참여 · 개선이 필요한 부분</text><text x="62" y="366" font-size="14" font-weight="700" fill="#131c36">2. Social &amp; Emotional Adjustment</text><text x="62" y="391" font-size="13" fill="#5f6980">교우 관계 · 학교 적응 · 정서 상태 · 생활 리듬</text><text x="62" y="430" font-size="14" font-weight="700" fill="#131c36">3. Parent–Teacher Conversation</text><text x="62" y="455" font-size="13" fill="#5f6980">학부모 질문과 과목교사 피드백을 바탕으로 다음 학기 방향을 정리</text></g>
<rect x="594" y="294" width="244" height="174" rx="6" fill="#ece9e1"/><rect x="613" y="313" width="206" height="104" rx="4" fill="#d7d2c8"/><rect x="635" y="337" width="52" height="52" rx="26" fill="#b9b4aa"/><rect x="701" y="337" width="52" height="52" rx="26" fill="#b9b4aa"/><rect x="767" y="337" width="28" height="52" rx="14" fill="#b9b4aa"/><text x="620" y="445" font-family="Arial,sans-serif" font-size="12" fill="#6a6a6a">상담 현장 이미지 · 개인정보 비식별화</text>
<rect x="62" y="500" width="776" height="38" rx="4" fill="#f1ede3"/><text x="78" y="524" font-family="Arial,sans-serif" font-size="12" fill="#5f6980">※ UIS Korea 제공 2026년 샘플 리포트를 바탕으로 학생 이름·사진 등 개인정보를 가린 재구성 예시입니다.</text>
</svg>