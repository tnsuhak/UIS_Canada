name: UIS Korean first-party voice pass

on:
  push:
    branches:
      - feature/remove-visa-finance-notice
    paths:
      - '.github/workflows/uis-korean-voice-pass.yml'

permissions:
  contents: write

jobs:
  edit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/remove-visa-finance-notice
          fetch-depth: 0
      - name: Rewrite detached source-attribution copy
        shell: python
        run: |
          from pathlib import Path
          import re

          targets = list(Path('.').rglob('*.html')) + [
              Path('netlify/edge-functions/main-enhancements.js'),
              Path('SITE_POLICY.md'), Path('NEWS_UPDATE.md'), Path('OUTCOMES_UPDATE.md')
          ]

          exact = {
            '아래 수치는 UIS가 공식 홈페이지와 학교 자료에서 공개한 2025년 성과를 기준으로 합니다.':
              '2025년 졸업생의 대학 합격 오퍼와 장학금 성과를 한 페이지에서 확인할 수 있습니다.',
            'UIS가 공개한 연도 비교 자료에서는 2025년 전체 합격 오퍼가 2024년보다 약 두 배로 늘었고, 미국 대학 오퍼도 2건에서 33건으로 증가했습니다.':
              '2025년 전체 합격 오퍼는 2024년보다 약 두 배로 늘었고, 미국 대학 오퍼도 2건에서 33건으로 증가했습니다.',
            'UIS 공개 자료 기준 졸업생 장학금 총액은 2024년 CAD $2.6M에서 2025년 CAD $3.25M으로 증가했습니다.':
              '졸업생 장학금 총액은 2024년 CAD $2.6M에서 2025년 CAD $3.25M으로 증가했습니다.',
            '계열별로는 수학·과학, 사회과학, 경영·경제·상경, 공학, 예술 순으로 오퍼가 많이 분포했으며, 공학 계열 오퍼는 전년 대비 크게 증가한 것으로 UIS 자료에 소개됐습니다.':
              '계열별로는 수학·과학, 사회과학, 경영·경제·상경, 공학, 예술 순으로 오퍼가 많이 분포했고, 공학 계열 오퍼도 전년 대비 크게 증가했습니다.',
            '2026년 UIS 졸업생의 대학 합격과 장학금 성과 중 현재 공식 자료로 확인된 내용을 정리했습니다. 2026년 5월 초 기준으로 대학 오퍼가 계속 발표 중이었기 때문에, 아래에서는 확인된 수치와 사례만 표시합니다.':
              '2026년 졸업생의 대학 합격과 장학금 성과 중 현재까지 확인된 내용을 정리했습니다. 2026년 5월 초에도 대학 오퍼가 계속 발표되고 있었기 때문에, 확정된 수치와 사례만 표시합니다.',
            'UIS 2026년 공식 뉴스레터에는 캐나다뿐 아니라 일본 주요 대학까지 다양한 진학 결과가 소개됐습니다.':
              '2026년에는 캐나다뿐 아니라 일본 주요 대학까지 다양한 진학 결과가 이어졌습니다.',
            'UIS는 졸업생들이 전 세계 대학으로부터 총 CAD 2.4M 이상의 장학금을 받았다고 발표했습니다.':
              '2026년 졸업생들은 전 세계 대학에서 총 CAD 2.4M 이상의 장학금을 받았습니다.',
            'UIS가 공유한 2026 University Offers 자료에서 University of Toronto Scarborough의 International Scholar Award, 4년간 CAD $100,000 장학금 사례가 확인됩니다.':
              'University of Toronto Scarborough의 International Scholar Award로 4년간 CAD $100,000 장학금을 받은 사례가 포함되어 있습니다.',
            'UIS 2026년 4월 뉴스레터는 주요 대학 합격 사례와 함께 CAD $40,000 규모의 장학금 사례를 소개했습니다.':
              'CAD $40,000 규모의 장학금 사례도 포함되어 있습니다.',
            '2026년 5월 1일 기준 자료에서는 Grade 12 대학 오퍼 발표가 계속 진행 중이라고 안내됐고, 최종 총 오퍼 수나 2025년과 같은 91%·100% 형태의 연간 최종 지표는 확인되지 않았습니다. 따라서 이 페이지는 현재 공식적으로 확인된 장학금 총액과 주요 오퍼 사례만 표시합니다.':
              '2026년 5월 1일 기준으로도 Grade 12 대학 오퍼 발표가 계속 진행 중이었으며, 최종 총 오퍼 수와 2025년의 91%·100%와 같은 연간 최종 지표는 아직 확정되지 않았습니다. 따라서 현재 확인된 장학금 총액과 주요 오퍼 사례만 표시합니다.',
            'UIS Korea에서 전달한 공식 월간 뉴스레터 중 가장 최근 2개월 소식을 한국 학생·학부모가 빠르게 볼 수 있도록 요약했습니다. 이전 소식은 뉴스 아카이브에서 계속 확인할 수 있습니다.':
              '매월 발행되는 UIS 뉴스레터 중 가장 최근 2개월 소식을 빠르게 볼 수 있도록 정리했습니다. 이전 소식은 뉴스 아카이브에서 계속 확인할 수 있습니다.',
            'UIS Korea가 2026년 8월 말 전달한 공식 뉴스레터를 바탕으로 Summer Immersion 현장학습, 연례 BBQ Party, 새 학기 준비 소식을 한국 학생·학부모 관점에서 간결하게 정리했습니다.':
              '2026년 8월에는 Summer Immersion 현장학습, 연례 BBQ Party, 9월 새 학기 준비가 이어졌습니다.',
            '뉴스레터에는 나이아가라 폭포, 아가 칸 박물관, 로열 온타리오 박물관(ROM) 방문이 소개됐습니다.':
              '학생들은 나이아가라 폭포, 아가 칸 박물관, 로열 온타리오 박물관(ROM)을 방문했습니다.',
            '학업 중심의 여름학기를 마친 뒤 학교 공동체가 함께 시간을 보내고 새 학기를 앞두고 분위기를 환기하는 행사로 소개됐습니다.':
              '학업 중심의 여름학기를 마친 뒤 학교 공동체가 함께 시간을 보내며 새 학기를 준비하는 행사입니다.',
            'UIS는 여름방학이 끝나는 시점에 새 신입생과 기존 재학생을 맞을 준비에 들어갔습니다. 8월 뉴스레터는 9월 오리엔테이션과 새 학기 소식이 이어질 예정이라고 안내했습니다.':
              '여름방학이 끝나는 시점부터 신입생과 재학생을 맞을 준비가 시작됐고, 9월에는 오리엔테이션과 새 학기 일정이 이어집니다.',
            'UIS Korea가 전달한 2026년 7월 공식 뉴스레터를 바탕으로 Summer Immersion, 신입생 오리엔테이션, Breakfast Club과 교내 여름 이벤트를 정리했습니다.':
              '2026년 7월에는 Summer Immersion, 신입생 오리엔테이션, Breakfast Club과 다양한 여름 교내 행사가 진행됐습니다.',
            '뉴스레터에는 2026 FIFA 월드컵 공동 개최국 캐나다를 학생과 교직원이 함께 응원한 학교생활 소식도 포함됐습니다.':
              '학생과 교직원은 2026 FIFA 월드컵 공동 개최국 캐나다를 함께 응원하는 시간도 가졌습니다.',
            'UIS KOREA · NEWS': 'UIS 한국어 안내 · NEWS',
            'UIS KOREA · OUTCOMES': 'UIS 한국어 안내 · 진학성과'
          }

          changed = []
          for path in targets:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              old = text
              for a, b in exact.items():
                  text = text.replace(a, b)

              # 월별 뉴스 상세페이지의 도입부에서 제3자 출처 설명 어투를 제거합니다.
              if str(path).startswith('news/') and path.suffix == '.html':
                  text = re.sub(
                      r'UIS Korea가[^<.]{0,140}?공식 뉴스레터를 바탕으로\s*',
                      '이번 달에는 ', text
                  )
                  text = re.sub(
                      r'UIS Korea가[^<.]{0,140}?뉴스레터를 바탕으로\s*',
                      '이번 달에는 ', text
                  )

              if text != old:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          # 앞으로도 같은 문체를 유지하도록 운영 문서에 명시합니다.
          policy = Path('SITE_POLICY.md')
          if policy.exists():
              text = policy.read_text(encoding='utf-8')
              marker = '## Korean editorial voice\n'
              if marker not in text:
                  text += '\n\n## Korean editorial voice\n- 본문은 UIS 한국어 안내페이지에서 직접 설명하는 1인칭 기관형 문체를 사용한다.\n- `UIS가 공개한`, `UIS 자료에 따르면`, `UIS가 말하기를`, `뉴스레터를 바탕으로 정리했다`처럼 제3자가 UIS를 설명하는 출처 귀속 문장은 피한다.\n- 사실은 본문에서 바로 말하고, 검증 출처는 페이지 하단의 작은 `자료 출처` 영역에서만 표시한다.\n- 실제 학교 소유 공식 도메인으로 오해할 수 있는 `UIS 공식 한국 홈페이지` 표기는 사용하지 않고 `UIS 한국어 안내`를 사용한다.\n'
                  policy.write_text(text, encoding='utf-8')
                  changed.append(str(policy))

          for docname in ['NEWS_UPDATE.md','OUTCOMES_UPDATE.md']:
              p = Path(docname)
              if p.exists():
                  text = p.read_text(encoding='utf-8')
                  rule = '\n- 문체: 본문에서는 사실을 직접 서술하고 `UIS가 공개한/UIS 자료에 따르면/뉴스레터를 바탕으로` 같은 제3자형 출처 설명은 쓰지 않는다. 출처는 하단 `자료 출처`에만 둔다.\n'
                  if rule.strip() not in text:
                      p.write_text(text.rstrip() + '\n' + rule, encoding='utf-8')
                      changed.append(str(p))

          print('changed:', *changed, sep='\n- ')
      - name: Commit editorial pass and remove temporary workflow
        run: |
          rm -f .github/workflows/uis-korean-voice-pass.yml
          git config user.name "tnsuhak"
          git config user.email "tnsuhak@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Use direct UIS Korean guide voice"
            git push origin HEAD:feature/remove-visa-finance-notice
          fi
