name: Remove visa finance notice

on:
  push:
    branches:
      - feature/remove-visa-finance-notice

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/remove-visa-finance-notice
      - name: Remove finance notice card
        shell: python
        run: |
          from pathlib import Path
          import re
          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          pattern = re.compile(
              r'<div class="card" style="border-left:3px solid var\(--crimson\)"><span class="card__key">2026년 9월 1일 시행</span><h3>학생비자 재정 증빙 기준이 올랐습니다</h3>.*?<p class="note">학비와 교통비와는 별도로 필요한 생활비 증빙 금액입니다\..*?</p></div>',
              re.S,
          )
          updated, count = pattern.subn("", text, count=1)
          if count != 1:
              raise SystemExit(f"Expected one finance notice card, found {count}")
          path.write_text(updated, encoding="utf-8")
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/remove-visa-finance-notice.yml
          git config user.name "tnsuhak"
          git config user.email "tnsuhak@gmail.com"
          git add index.html .github/workflows/remove-visa-finance-notice.yml
          git commit -m "Remove student visa finance notice"
          git push origin HEAD:feature/remove-visa-finance-notice
