name: Materialize one UIS homestay review image

on:
  push:
    branches:
      - feature/qc-report-real-html-reset

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout temp branch
        uses: actions/checkout@v4
        with:
          ref: feature/qc-report-real-html-reset
          fetch-depth: 0

      - name: Build WebP from staged chunks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          cat .qc-upload/part-01 .qc-upload/part-02 .qc-upload/part-03 .qc-upload/part-04 .qc-upload/part-05 .qc-upload/part-06 > /tmp/uis-review.b64
          base64 -d /tmp/uis-review.b64 > assets/uis-homestay-pre-inspection-review-20260311.webp
          test "$(head -c 4 assets/uis-homestay-pre-inspection-review-20260311.webp)" = "RIFF"
          test "$(dd if=assets/uis-homestay-pre-inspection-review-20260311.webp bs=1 skip=8 count=4 status=none)" = "WEBP"
          file assets/uis-homestay-pre-inspection-review-20260311.webp

      - name: Commit only final image and clean staging files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .qc-upload
          rm -f .github/workflows/materialize-one-uis-homestay-review.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Materialize UIS homestay review image"
          git push origin HEAD:feature/qc-report-real-html-reset
