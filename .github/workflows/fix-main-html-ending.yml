name: Fix UIS main HTML ending

on:
  push:
    branches:
      - feature/remove-visa-finance-notice

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/remove-visa-finance-notice
          fetch-depth: 0
      - name: Repair index ending
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8').rstrip()
          floating='''<!-- TNS-FLOAT-START --><div class="tns-float"><a class="kakao" href="https://open.kakao.com/o/slehLvKi" target="_blank" rel="noopener">카톡 상담</a><a class="phone" href="tel:02-3288-1733">전화 상담</a></div><!-- TNS-FLOAT-END -->'''
          if '<!-- TNS-FLOAT-START -->' not in s:
              s += '\n' + floating
          if not s.endswith('</body>') and not s.endswith('</html>'):
              s += '\n</body>\n</html>\n'
          elif s.endswith('</body>'):
              s += '\n</html>\n'
          p.write_text(s,encoding='utf-8')
          PY
      - name: Remove temporary workflow
        run: rm -f .github/workflows/fix-main-html-ending.yml
      - name: Commit changes
        run: |
          git config user.name "tns-site-manager"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix main HTML ending and floating TNS contacts"
          git push origin HEAD:feature/remove-visa-finance-notice
