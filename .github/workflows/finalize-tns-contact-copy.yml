name: Finalize TNS consultation wording

on:
  push:
    branches:
      - feature/remove-visa-finance-notice

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/remove-visa-finance-notice
          fetch-depth: 0
      - name: Finalize visible contact wording
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              '한국센터 상담 신청': 'TNS유학 무료 상담',
              '한국센터 상담 문의': 'TNS유학 상담 문의',
              '한국센터에 메일 보내기': 'TNS유학에 문의하기',
          }
          for p in Path('.').rglob('*.html'):
              s=p.read_text(encoding='utf-8')
              for old,new in replacements.items():
                  s=s.replace(old,new)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Remove temporary workflow
        run: rm -f .github/workflows/finalize-tns-contact-copy.yml
      - name: Commit changes
        run: |
          git config user.name "tns-site-manager"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Finalize TNS consultation wording"
          git push origin HEAD:feature/remove-visa-finance-notice
