name: Apply TNS contact details

on:
  push:
    branches:
      - feature/remove-visa-finance-notice

permissions:
  contents: write

jobs:
  update-contact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/remove-visa-finance-notice
          fetch-depth: 0
      - name: Update UIS contact surfaces
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          KAKAO = 'https://open.kakao.com/o/slehLvKi'
          OFFICE = '02-3288-1733'
          MOBILE = '010-5150-0105'
          EMAIL = 'tns@tnsuhak.com'

          css = r'''<!-- TNS-CONTACT-CSS-START -->
          <style>
          .tns-contact{background:#101a32;color:#fff;padding:64px 0;border-top:3px solid #BE9134}.tns-wrap{width:min(1120px,calc(100% - 36px));margin:auto}.tns-kicker{margin:0 0 10px;color:#e4d3a8;font-size:12px;font-weight:800;letter-spacing:.12em}.tns-contact h2{margin:0;font-family:Georgia,"Noto Serif KR",serif;font-size:clamp(28px,4vw,40px);line-height:1.25;color:#fff}.tns-lead{max-width:820px;margin:14px 0 0;color:rgba(255,255,255,.73)}.tns-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}.tns-action{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;padding:13px 18px;border-radius:4px;font-weight:800;border:1px solid rgba(255,255,255,.5);color:#fff}.tns-action--kakao{background:#FEE500;border-color:#FEE500;color:#171717}.tns-action--phone{background:#8E1B22;border-color:#8E1B22}.tns-company{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:34px;padding-top:25px;border-top:1px solid rgba(255,255,255,.17);font-size:13.5px;line-height:1.85;color:rgba(255,255,255,.68)}.tns-company strong{color:#fff}.tns-company a{color:#f3dfaa;text-decoration:none}.tns-footer{background:#0b1325;color:rgba(255,255,255,.55);font-size:12.5px;padding:17px 18px;text-align:center}.tns-float{position:fixed;right:14px;bottom:14px;z-index:999;display:flex;flex-direction:column;gap:8px}.tns-float a{min-width:76px;padding:10px 12px;text-align:center;text-decoration:none;border-radius:999px;font-size:13px;font-weight:800;box-shadow:0 6px 20px rgba(0,0,0,.22)}.tns-float .kakao{background:#FEE500;color:#171717}.tns-float .phone{background:#8E1B22;color:#fff}@media(max-width:720px){.tns-company{grid-template-columns:1fr}.tns-actions{display:grid;grid-template-columns:1fr}.tns-action{width:100%}.tns-float{right:10px;bottom:10px}.tns-float a{min-width:68px;padding:9px 10px;font-size:12px}}
          </style>
          <!-- TNS-CONTACT-CSS-END -->'''

          contact = f'''<!-- TNS-CONTACT-START -->
          <section class="tns-contact" id="tns-contact"><div class="tns-wrap">
            <p class="tns-kicker">TNS유학 · UIS 입학상담</p>
            <h2>UIS 상담은 TNS유학으로 문의하세요</h2>
            <p class="tns-lead">입학조건, 학업 플랜, 학비, 숙소, 학생비자 준비와 지원 절차까지 TNS유학에서 한국어로 안내해 드립니다.</p>
            <div class="tns-actions">
              <a class="tns-action tns-action--kakao" href="{KAKAO}" target="_blank" rel="noopener">💬 카카오톡 무료 상담</a>
              <a class="tns-action tns-action--phone" href="tel:{OFFICE}">☎ 전화 상담 {OFFICE}</a>
              <a class="tns-action" href="tel:{MOBILE}">📱 {MOBILE}</a>
            </div>
            <div class="tns-company">
              <div><strong>TNS유학 · ㈜티앤에스월드와이드</strong><br>대표 신윤옥 · 사업자등록번호 220-87-54964<br>Email. <a href="mailto:{EMAIL}">{EMAIL}</a><br>Tel. 02-3288-1733~5 · {MOBILE}</div>
              <div><strong>서울 본사</strong><br>서울 강남구 테헤란로5길 7 KG타워 B1<br><strong>부산 지사</strong><br>부산 부산진구 중앙대로 694 쥬디스태화 9층 37호</div>
            </div>
          </div></section>
          <!-- TNS-CONTACT-END -->'''

          main_contact = contact.replace('id="tns-contact"','id="contact"')
          footer = '''<!-- TNS-FOOTER-START --><footer class="tns-footer">© 2026 TNS Worldwide Co., Ltd. · UIS 한국어 입학안내</footer><!-- TNS-FOOTER-END -->'''
          floating = f'''<!-- TNS-FLOAT-START --><div class="tns-float"><a class="kakao" href="{KAKAO}" target="_blank" rel="noopener">카톡 상담</a><a class="phone" href="tel:{OFFICE}">전화 상담</a></div><!-- TNS-FLOAT-END -->'''

          def strip_marked(s, start, end):
              return re.sub(re.escape(start)+r'.*?'+re.escape(end), '', s, flags=re.S)

          for p in Path('.').rglob('*.html'):
              s = p.read_text(encoding='utf-8')
              # idempotent cleanup
              s = strip_marked(s, '<!-- TNS-CONTACT-CSS-START -->', '<!-- TNS-CONTACT-CSS-END -->')
              s = strip_marked(s, '<!-- TNS-CONTACT-START -->', '<!-- TNS-CONTACT-END -->')
              s = strip_marked(s, '<!-- TNS-FOOTER-START -->', '<!-- TNS-FOOTER-END -->')
              s = strip_marked(s, '<!-- TNS-FLOAT-START -->', '<!-- TNS-FLOAT-END -->')

              if '</head>' in s:
                  s = s.replace('</head>', css + '\n</head>', 1)

              if p.name == 'index.html' and p.parent == Path('.'):
                  # Replace the old UIS Korea contact section and school footer.
                  s = re.sub(r'<section class="sec sec--dark" id="contact">.*?</section>', main_contact, s, count=1, flags=re.S)
                  s = re.sub(r'<footer class="foot">.*?</footer>', footer, s, count=1, flags=re.S)
                  # Keep application/support routed through TNS rather than direct school email.
                  s = s.replace('UIS 입학지원서, 최근 2개 학년 영문 성적표, 여권 사본을 <a href="mailto:info@uihs.ca">info@uihs.ca</a>로 보냅니다. 검토가 끝나면 담당 카운슬러가 배정됩니다.', 'UIS 지원에 필요한 서류를 준비한 뒤 TNS유학으로 보내 주세요. 최근 2개 학년 영문 성적표와 여권 사본 등 필요한 자료를 확인하고, 학교 제출 및 이후 절차를 안내해 드립니다.')
                  if footer not in s and '</body>' in s:
                      s = s.replace('</body>', footer+'\n</body>',1)
              else:
                  # Replace existing red CTA blocks on detail/archive pages.
                  if re.search(r'<section class="cta">.*?</section>', s, flags=re.S):
                      s = re.sub(r'<section class="cta">.*?</section>', contact, s, count=1, flags=re.S)
                  elif '</main>' in s:
                      s = s.replace('</main>', contact+'\n</main>',1)
                  else:
                      s = s.replace('</body>', contact+'\n</body>',1)
                  if '</body>' in s:
                      s = s.replace('</body>', footer+'\n</body>',1)

              if '</body>' in s:
                  s = s.replace('</body>', floating+'\n</body>',1)
              p.write_text(s, encoding='utf-8')

          # Record a site-specific durable rule.
          policy = Path('SITE_POLICY.md')
          text = policy.read_text(encoding='utf-8') if policy.exists() else '# UIS Korea site-specific operating notes\n\n'
          marker = '## Consultation / conversion\n'
          rule = ('## Consultation / conversion\n'
                  '- All user-visible admission/contact CTAs route to **TNS유학 · ㈜티앤에스월드와이드**, not UIS Korea direct contact.\n'
                  '- Primary Kakao consultation: https://open.kakao.com/o/slehLvKi\n'
                  '- Primary office phone: 02-3288-1733 (company listing 02-3288-1733~5); mobile: 010-5150-0105.\n'
                  '- Email: tns@tnsuhak.com.\n'
                  '- Company information and Seoul/Busan office addresses should appear on contact surfaces.\n'
                  '- School contact details may remain in structured data or factual source context when needed, but are not the primary conversion path.\n')
          if marker in text:
              text = re.sub(r'## Consultation / conversion\n.*?(?=\n## |\Z)', rule.rstrip(), text, flags=re.S) + '\n'
          else:
              text = text.rstrip() + '\n\n' + rule
          policy.write_text(text, encoding='utf-8')
          PY
      - name: Remove temporary workflow
        run: rm -f .github/workflows/uis-tns-contact-pass.yml
      - name: Commit changes
        run: |
          git config user.name "tns-site-manager"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Route UIS inquiries to TNS consultation"
          git push origin HEAD:feature/remove-visa-finance-notice
