name: UIS Predeploy Audit

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  source-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit source SEO, sitemap, links and assets
        run: python .github/scripts/predeploy_audit.py

  live-preview-audit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      LIVE_BASE: https://deploy-preview-${{ github.event.pull_request.number }}--uis-korea.netlify.app
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Netlify Deploy Preview
        run: |
          python - <<'PY'
          import os, time, urllib.request
          base = os.environ['LIVE_BASE'].rstrip('/')
          last = None
          for _ in range(30):
              try:
                  req = urllib.request.Request(base + '/', headers={'User-Agent':'Mozilla/5.0 TNS-Preview-Wait/1.0'})
                  with urllib.request.urlopen(req, timeout=15) as r:
                      if r.status == 200:
                          print('Preview ready:', base)
                          break
              except Exception as e:
                  last = e
              time.sleep(5)
          else:
              raise SystemExit(f'Preview did not become ready: {last}')
          PY
      - name: Audit actual deployed Preview HTML and links
        run: python .github/scripts/live_preview_audit.py
      - name: Verify Preview is not indexable
        run: |
          python - <<'PY'
          import os, urllib.request
          base=os.environ['LIVE_BASE'].rstrip('/')
          req=urllib.request.Request(base+'/',headers={'User-Agent':'Mozilla/5.0 TNS-Preview-Indexing-Check/1.0'})
          with urllib.request.urlopen(req,timeout=20) as r:
              xrobots=(r.headers.get('X-Robots-Tag') or '').lower()
          with urllib.request.urlopen(base+'/robots.txt',timeout=20) as r:
              robots=r.read(100000).decode('utf-8','replace').lower()
          if 'noindex' not in xrobots:
              raise SystemExit('Preview missing X-Robots-Tag noindex')
          if 'disallow: /' not in robots:
              raise SystemExit('Preview robots.txt is not disallowing crawl')
          print('PASS: Preview noindex header and robots disallow are active')
          PY
      - name: Audit canonical URL routing
        run: python .github/scripts/url_shape_audit.py
