name: Materialize UIS QC report images

on:
  push:
    branches:
      - feature/remove-visa-finance-notice
    paths:
      - '.github/workflows/materialize-qc-images.yml'
      - 'assets/qc/lunch-a.txt'
      - 'assets/qc/homestay-a.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/remove-visa-finance-notice
          fetch-depth: 0

      - name: Decode report images to real WebP files
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const jobs = [
            ['assets/qc/lunch-a.txt', 'assets/qc-lunch-report-20260906.webp'],
            ['assets/qc/homestay-a.txt', 'assets/qc-homestay-report-20260906.webp']
          ];
          for (const [src, out] of jobs) {
            const text = fs.readFileSync(src, 'utf8').replace(/[^A-Za-z0-9+/=]/g, '');
            const data = Buffer.from(text, 'base64');
            if (data.subarray(0, 4).toString('ascii') !== 'RIFF' || data.subarray(8, 12).toString('ascii') !== 'WEBP') {
              throw new Error(`${src} did not decode to a WebP file`);
            }
            fs.writeFileSync(out, data);
            console.log(`${out}: ${data.length} bytes`);
          }
          NODE
          file assets/qc-lunch-report-20260906.webp
          file assets/qc-homestay-report-20260906.webp

      - name: Commit real binary image files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/qc-lunch-report-20260906.webp assets/qc-homestay-report-20260906.webp
          if git diff --cached --quiet; then
            echo "Binary QC images already materialized."
            exit 0
          fi
          git commit -m "Materialize UIS QC report WebP assets"
          git push origin HEAD:feature/remove-visa-finance-notice
