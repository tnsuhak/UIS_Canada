name: Probe Canva UIS report view

on:
  push:
    branches:
      - feature/qc-image-clean-rebuild

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Canva view URL
        shell: bash
        run: |
          set -euo pipefail
          echo '--- redirect headers ---'
          curl -sSIL 'https://www.canva.com/d/ZjUgRqWvI0XZ8Uf' | sed -n '1,120p'
          echo '--- effective URL ---'
          curl -sSL -o /tmp/canva.html -w '%{url_effective}\n' 'https://www.canva.com/d/ZjUgRqWvI0XZ8Uf'
          echo '--- page hints ---'
          grep -Eo 'https://[^"'"'"' ]+|<link[^>]+>|<meta[^>]+' /tmp/canva.html | grep -Ei 'embed|canonical|og:image|design/DAHUgOair0s|media.canva' | head -80 || true
